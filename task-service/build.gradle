plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2024.0.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.cloud:spring-cloud-kubernetes-client-autoconfig:3.3.0'
    implementation 'org.springframework.cloud:spring-cloud-starter-kubernetes-client-loadbalancer:3.3.0'
    implementation 'org.springframework.cloud:spring-cloud-kubernetes-client-discovery:3.3.0'
    implementation 'org.springframework.cloud:spring-cloud-starter-kubernetes-client:3.3.0'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation project(':dto')

}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}
