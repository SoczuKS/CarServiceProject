apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workshop-service
  template:
    metadata:
      labels:
        app: workshop-service
    spec:
      containers:
        - name: workshop-service
          image: workshop-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8766
          env:
            - name: SERVER_PORT
              value: "8766"
---
apiVersion: v1
kind: Service
metadata:
  name: workshop-service
spec:
  type: NodePort
  selector:
    app: workshop-service
  ports:
    - protocol: TCP
      port: 8766
      targetPort: 8766
      nodePort: 30006