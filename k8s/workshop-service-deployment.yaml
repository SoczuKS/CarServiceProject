apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workshop-service
  template:
    metadata:
      labels:
        app: workshop-service
    spec:
      containers:
        - name: workshop-service
          image: workshop-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8766
          env:
            - name: SERVER_PORT
              value: "8766"
      serviceAccountName: workshop-service

---
apiVersion: v1
kind: Service
metadata:
  name: workshop-service
spec:
  type: NodePort
  selector:
    app: workshop-service
  ports:
    - protocol: TCP
      port: 8766
      targetPort: 8766
      nodePort: 30006

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workshop-service
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: endpoints-reader-workshop
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: endpoints-reader-workshop-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: workshop-service
    namespace: default
roleRef:
  kind: Role
  name: endpoints-reader-workshop
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: services-reader-workshop
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: services-reader-workshop-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: workshop-service
    namespace: default
roleRef:
  kind: Role
  name: services-reader-workshop
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pods-reader-workshop
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pods-reader-workshop-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: workshop-service
    namespace: default
roleRef:
  kind: Role
  name: pods-reader-workshop
  apiGroup: rbac.authorization.k8s.io
