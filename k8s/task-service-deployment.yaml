apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      containers:
        - name: task-service
          image: task-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8771
          env:
            - name: SERVER_PORT
              value: "8771"
      serviceAccountName: task-service

---
apiVersion: v1
kind: Service
metadata:
  name: task-service
spec:
  type: NodePort
  selector:
    app: task-service
  ports:
    - protocol: TCP
      port: 8771
      targetPort: 8771
      nodePort: 30011

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-service
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: endpoints-reader-task
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: endpoints-reader-task-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: task-service
    namespace: default
roleRef:
  kind: Role
  name: endpoints-reader-task
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: services-reader-task
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: services-reader-task-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: task-service
    namespace: default
roleRef:
  kind: Role
  name: services-reader-task
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pods-reader-task
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pods-reader-task-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: task-service
    namespace: default
roleRef:
  kind: Role
  name: pods-reader-task
  apiGroup: rbac.authorization.k8s.io
