apiVersion: apps/v1
kind: Deployment
metadata:
  name: commission-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commission-service
  template:
    metadata:
      labels:
        app: commission-service
    spec:
      containers:
        - name: commission-service
          image: commission-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8770
          env:
            - name: SERVER_PORT
              value: "8770"
      serviceAccountName: commission-service

---
apiVersion: v1
kind: Service
metadata:
  name: commission-service
spec:
  type: NodePort
  selector:
    app: commission-service
  ports:
    - protocol: TCP
      port: 8770
      targetPort: 8770
      nodePort: 30010

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: commission-service
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: endpoints-reader-commission
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: endpoints-reader-commission-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: commission-service
    namespace: default
roleRef:
  kind: Role
  name: endpoints-reader-commission
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: services-reader-commission
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: services-reader-commission-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: commission-service
    namespace: default
roleRef:
  kind: Role
  name: services-reader-commission
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pods-reader-commission
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pods-reader-commission-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: commission-service
    namespace: default
roleRef:
  kind: Role
  name: pods-reader-commission
  apiGroup: rbac.authorization.k8s.io
