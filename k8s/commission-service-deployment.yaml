apiVersion: apps/v1
kind: Deployment
metadata:
  name: commission-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commission-service
  template:
    metadata:
      labels:
        app: commission-service
    spec:
      containers:
        - name: commission-service
          image: commission-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8770
          env:
            - name: SERVER_PORT
              value: "8770"
---
apiVersion: v1
kind: Service
metadata:
  name: commission-service
spec:
  type: NodePort
  selector:
    app: commission-service
  ports:
    - protocol: TCP
      port: 8770
      targetPort: 8770
      nodePort: 30010