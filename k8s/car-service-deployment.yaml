apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: car-service
  template:
    metadata:
      labels:
        app: car-service
    spec:
      containers:
        - name: car-service
          image: car-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8767
          env:
            - name: SERVER_PORT
              value: "8767"
---
apiVersion: v1
kind: Service
metadata:
  name: car-service
spec:
  type: NodePort
  selector:
    app: car-service
  ports:
    - protocol: TCP
      port: 8767
      targetPort: 8767
      nodePort: 30007