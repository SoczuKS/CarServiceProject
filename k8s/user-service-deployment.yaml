apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8763
          env:
            - name: SERVER_PORT
              value: "8763"
      serviceAccountName: user-service

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  selector:
    app: user-service
  ports:
    - protocol: TCP
      port: 8763
      targetPort: 8763

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: endpoints-reader-user
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: endpoints-reader-user-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: user-service
    namespace: default
roleRef:
  kind: Role
  name: endpoints-reader-user
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: services-reader-user
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: services-reader-user-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: user-service
    namespace: default
roleRef:
  kind: Role
  name: services-reader-user
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pods-reader-user
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pods-reader-user-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: user-service
    namespace: default
roleRef:
  kind: Role
  name: pods-reader-user
  apiGroup: rbac.authorization.k8s.io