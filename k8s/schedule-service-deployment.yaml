apiVersion: apps/v1
kind: Deployment
metadata:
  name: schedule-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schedule-service
  template:
    metadata:
      labels:
        app: schedule-service
    spec:
      containers:
        - name: schedule-service
          image: schedule-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8764
          env:
            - name: SERVER_PORT
              value: "8764"
      serviceAccountName: schedule-service

---
apiVersion: v1
kind: Service
metadata:
  name: schedule-service
spec:
  type: NodePort
  selector:
    app: schedule-service
  ports:
    - protocol: TCP
      port: 8764
      targetPort: 8764
      nodePort: 30004

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: schedule-service
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: endpoints-reader-schedule
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: endpoints-reader-schedule-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: schedule-service
    namespace: default
roleRef:
  kind: Role
  name: endpoints-reader-schedule
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: services-reader-schedule
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: services-reader-schedule-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: schedule-service
    namespace: default
roleRef:
  kind: Role
  name: services-reader-schedule
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pods-reader-schedule
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pods-reader-schedule-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: schedule-service
    namespace: default
roleRef:
  kind: Role
  name: pods-reader-schedule
  apiGroup: rbac.authorization.k8s.io
