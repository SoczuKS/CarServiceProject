apiVersion: apps/v1
kind: Deployment
metadata:
  name: schedule-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schedule-service
  template:
    metadata:
      labels:
        app: schedule-service
    spec:
      containers:
        - name: schedule-service
          image: schedule-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8764
          env:
            - name: SERVER_PORT
              value: "8764"
---
apiVersion: v1
kind: Service
metadata:
  name: schedule-service
spec:
  type: NodePort
  selector:
    app: schedule-service
  ports:
    - protocol: TCP
      port: 8764
      targetPort: 8764
      nodePort: 30004