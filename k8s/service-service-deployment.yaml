apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-service
  template:
    metadata:
      labels:
        app: service-service
    spec:
      containers:
        - name: service-service
          image: service-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8769
          env:
            - name: SERVER_PORT
              value: "8769"
---
apiVersion: v1
kind: Service
metadata:
  name: service-service
spec:
  type: NodePort
  selector:
    app: service-service
  ports:
    - protocol: TCP
      port: 8769
      targetPort: 8769
      nodePort: 30009