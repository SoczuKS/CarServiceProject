apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-service
  template:
    metadata:
      labels:
        app: service-service
    spec:
      containers:
        - name: service-service
          image: service-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8769
          env:
            - name: SERVER_PORT
              value: "8769"
      serviceAccountName: service-service

---
apiVersion: v1
kind: Service
metadata:
  name: service-service
spec:
  type: NodePort
  selector:
    app: service-service
  ports:
    - protocol: TCP
      port: 8769
      targetPort: 8769
      nodePort: 30009

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-service
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: endpoints-reader-service
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: endpoints-reader-service-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: service-service
    namespace: default
roleRef:
  kind: Role
  name: endpoints-reader-service
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: services-reader-service
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: services-reader-service-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: service-service
    namespace: default
roleRef:
  kind: Role
  name: services-reader-service
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pods-reader-service
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pods-reader-service-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: service-service
    namespace: default
roleRef:
  kind: Role
  name: pods-reader-service
  apiGroup: rbac.authorization.k8s.io
